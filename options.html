<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Configuration Dolibarr</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #0064D2; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
    #load-suppliers { display: block; margin-bottom: 10px; }
    #status { margin-top: 10px; color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Configuration Dolibarr</h2>
  <div class="field">
    <label for="url">URL de votre Dolibarr :</label>
    <input type="text" id="url" placeholder="https://votre-serveur.com/dolibarr">
  </div>
  <div class="field">
    <label for="apikey">Clé API (DOLAPIKEY) :</label>
    <input type="password" id="apikey" placeholder="Votre clé API secrète">
  </div>
  <div class="field">
    <label for="ebay-supplier">Tiers fournisseur pour eBay :</label>
    <select id="ebay-supplier">
      <option value="">Chargez d’abord la liste des fournisseurs</option>
    </select>
  </div>
  <div class="field">
    <label for="aliexpress-supplier">Tiers fournisseur pour AliExpress :</label>
    <select id="aliexpress-supplier">
      <option value="">Chargez d’abord la liste des fournisseurs</option>
    </select>
  </div>
  <button id="load-suppliers" type="button">Charger les fournisseurs</button>
  <button id="save" type="button">Enregistrer</button>
  <button id="test-connection" type="button">Tester la connexion</button>
  <div id="status" aria-live="polite"></div>

  <script src="options.js"></script>
</body>
</html>
